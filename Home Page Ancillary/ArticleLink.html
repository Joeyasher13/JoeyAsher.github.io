<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Preview</title>
    <style>
		
		h3 {
			font-size: 2em; /* Increase the font size for the name */
			font-family: 'Quicksand', sans-serif;
			color: rgb(23, 23, 23); /* Text color for the header */
			text-align: center;
		}
		
		
        body {
            font-family: Arial, sans-serif;
            margin: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        a.article-link {
            text-decoration: none; /* Removes underline from the link */
            color: inherit; /* Ensures the link color matches the surrounding text */
            text-align: center; /* Centers the text */
        }

        .thumbnail img {
    max-width: 100%;
    height: auto;
    cursor: pointer; /* Changes cursor to pointer to indicate clickable link */
    padding-top: 50px;
        }

        .article-description {
            font-size: 16px;
            margin-top: 10px; /* Adds some space between the image and the text */
        }
    </style>
</head>
<body>
	
	<h3>Read about me and my team's recent win in our senior design capstone project</h3>
	
	
    <a href="https://www.minesnewsroom.com/news/underwater-prospecting-rover-wins-top-honors-fall-2023-capstone-design-showcase" class="article-link" target="_blank">
        <div class="thumbnail">
            <img src="Brag Photos/capstonearticle.png" alt="Article Thumbnail">
        </div>
        <div class="article-description">
        </div>
    </a>
</body>
</html>
